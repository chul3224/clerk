## 📋 슬라이드 10장 구성 (참고)

1. **표지** — `404` 거대 숫자 + 슬로건 + 우측 검정 패널에 3개 통계 (3단계 / 75% / <3s)
2. **문제** — 좌측 거대 인용구 + 우측 4개 페인 카드
3. **미션** — 풀스크린 거대 텍스트 + 빨간 밑줄 액센트
4. **파이프라인** — 4단계 가로 플로우(STEP 0 → FILTER 01 → 02 → 03 verdict)
5. **필터 01 상세** — 좌측 거대 h2 + 우측 3개 셀(C2PA / EXIF / SynthID, 마지막은 span 2)
6. **필터 02 상세 (Gemini)** — 좌측 프롬프트 6체크포인트(검정 배경 mono) + 우측 리플라이 카드
7. **KPI** — 6개 메트릭 카드, 첫 칸 Recall만 검정+빨강 별표
8. **로드맵** — 3개 세로 레인, 현재(Phase 1)만 빨간 보더+빨간 헤더
9. **팀** — 5명 카드(아바타는 검정 사각형 + 흰 글자 한 글자)
10. **마무리** — 좌측 검정 풀패널 거대 텍스트 + 우측 크림 패널 로고

