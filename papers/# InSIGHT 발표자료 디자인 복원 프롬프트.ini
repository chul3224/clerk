## 🖼 아이콘 (Lucide 외 금지)

- **라이브러리**: [Lucide](https://lucide.dev/) CDN. 2px stroke, round caps, 24×24 grid.
- 임포트:
  ```html
  <script src="https://unpkg.com/lucide@latest"></script>
  <i data-lucide="scan-search"></i>
  <script>lucide.createIcons();</script>
  ```
- **자주 쓰는 아이콘**: `scan-search`, `shield-check`, `shield-alert`, `triangle-alert`, `fingerprint`, `radar`, `sparkles`, `brain-circuit`, `link-2`, `arrow-right`, `check-circle-2`, `circle-help`.
- **금지**: SVG 직접 그리기, 이모지를 아이콘으로 사용, 컬러 아이콘.

### 이모지 정책
인라인 이모지 금지. 단 시그니처 5개만 카드/리스트 prefix로 허용:
`🛡 ❌ ✅ ❓ 🚨`

