## 🅰️ 카피라이팅 톤

### 언어
- 한국어 우선. 영어는 기술 용어·약어만.
- 격식체 (`-합니다`, `-입니다`).
- 1인칭 안 씀. 사용자 호칭 생략.

### 판정 결과 표현 — 무조건 3분류
```
❌ AI 생성 / ✅ 실제 이미지 / ❓ 판별 불확실
```
"AI 아님" 같은 표현 절대 금지 (워터마크 없음 ≠ AI 아님).

### 시그니처 표현
- "디지털 신뢰를 회복", "이중/3단 필터링", "1차 필터 / 2차 필터"
- "미탐 (False Negative)" — 항상 한+영 병기
- "★핵심 지표" — Recall에만 붙임
- 슬로건은 항상 `숫자: snake_case_표현` 형태 (예: `404: Human_Not_Found`, `204: Reality_Verified`)

### 수치 표기
- 단위까지 끝까지: `Recall 75%`, `Inference 2.4초`, `$0.0002 / IMG`
- 모노 폰트로 출력

