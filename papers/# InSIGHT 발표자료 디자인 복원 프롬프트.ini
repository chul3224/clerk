## ✍️ 타이포그래피 (반드시 이 폰트만)

### 폰트 패밀리

```
디스플레이·본문 : Pretendard (한국어+영문) — fallback: Inter, Apple SD Gothic Neo, Noto Sans KR
모노스페이스    : JetBrains Mono — 메트릭, 코드, "포렌식 readout" 용
```

CDN 임포트:
```css
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap");
```

### 타입 스케일 (1920×1080 슬라이드 기준)

| 용도 | 크기 | weight | letter-spacing | 예시 |
|---|---|---|---|---|
| Hero 거대 숫자 (`404`) | 240px | 900 | -0.045em | 표지 |
| 메인 슬라이드 헤드라인 | 96–144px | 800–900 | -0.04em | "디지털 신뢰를 지키는 눈" |
| 슬라이드 H2 | 80–96px | 800 | -0.035em | "3단 필터링 파이프라인" |
| 카드 제목 | 40–44px | 800 | -0.025em | "C2PA · EXIF" |
| 카드 부제 | 22–28px | 600–700 | -0.015em | "메타데이터 서명" |
| 본문 lead | 22px | 400 | 0 | 1.55 line-height |
| 카드 본문 | 18–20px | 400 | 0 | 1.5 line-height |
| 캡션·푸터 | 16–18px | 600 | 0.14em | UPPERCASE |
| 모노 태그 라벨 | 14–22px | 600–700 | 0.14em–0.18em | UPPERCASE, "FILTER 01 · C2PA" |

**핵심 규칙**:
1. 큰 숫자(`404`, `75%`)는 항상 **weight 900 + negative letter-spacing**. "두꺼움"이 브랜드 자체.
2. 본문은 weight 400. 그 사이 weight(500, 600)는 거의 비워둠.
3. 모든 UPPERCASE 라벨은 **JetBrains Mono + letter-spacing 0.12em 이상**. Pretendard로 대문자 만들지 말 것.
4. 한·영 혼용 시 영문 약어(C2PA, EXIF, FFT…)는 대문자 보존, 그 외 띄어쓰기 한 칸.

