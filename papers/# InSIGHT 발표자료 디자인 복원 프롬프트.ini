## 🧱 슬라이드 기본 골격 (1920×1080)

매 슬라이드 공통:
```
[상단 chrome — 48px from top, 80px 좌우]
  좌측 : INSIGHT 워드마크(Pretendard 900, 22px) · 헤어라인 · "04 · Architecture" (mono UPPERCASE 18px)
  우측 : "3-STAGE PIPELINE" (mono UPPERCASE 18px, ink-500)

[본문 — 160px top padding, 80px 좌우 padding]
  hero h2: 80–96px / weight 800 / -0.035em
  콘텐츠 그리드 또는 단일 hero 텍스트

[하단 chrome — 48px from bottom, 80px 좌우]
  좌측 : "04 / 10" (mono UPPERCASE 16px)
  우측 : 슬라이드 소제목 (mono UPPERCASE 16px)
```

### 카드 기본형
```css
.card {
  background: var(--paper-0);    /* 또는 paper-100 */
  border: 1px solid var(--ink-900);  /* 1px ink-200도 OK */
  border-radius: 12px;
  padding: 24–28px;
  display: flex; flex-direction: column; gap: 14px;
}
.card .head {
  display: flex; justify-content: space-between; align-items: center;
}
.card .ix {     /* "FILTER 01 · C2PA" */
  font-family: JetBrains Mono;
  font-size: 14–16px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-500);
}
.card h3 {       /* 카드 메인 타이틀 */
  font-family: Pretendard;
  font-weight: 800; font-size: 40–44px;
  letter-spacing: -0.025em;
}
```

### 시맨틱 알림 카드
좌측 컬러 보더 4px 단독 금지. 전체 보더 + 같은 hue 배경 사용:
```css
.card.detected {
  background: #FBE5E2;
  border-color: #E0392B;
}
.card.detected h3 { color: #7A1F17; }
```

