# InSIGHT 발표자료 디자인 복원 프롬프트

> 이 파일을 그대로 복사해서 AI(Claude / GPT / Gemini)에게 붙여넣으면, InSIGHT 발표자료의 원래 디자인 시스템대로 슬라이드를 다시 만들거나 망가진 디자인을 복원할 수 있습니다. 팀원이 슬라이드를 수정하다가 톤이 무너졌을 때 "이 시스템대로 다시 정리해줘" 라고 보내면 됩니다.

---

## 🎯 프로젝트 정체성

- **프로젝트명**: InSIGHT (Instagram AI-Video Guardian)
- **슬로건**: `404: Human_Not_Found`
- **분위기**: 포렌식 / 감시 / 검열의 무드. 보안 잡지, 모노톤 다큐멘터리, 터미널 readout 같은 느낌.
- **금지**: 보라·핑크 그라데이션, 둥글둥글 일러스트, AI슬롭 아이콘, 이모지 폭격, 컬러 그림자.

---

## 🎨 컬러 (절대 변경 금지)

### Foundation — Ink & Paper
화면의 90%는 이 두 색만 씁니다. 잉크는 검정 계열, 페이퍼는 따뜻한 크림.

```
--ink-900: #0B0B0E   /* 본문, 헤드라인 — 가장 진한 잉크 */
--ink-800: #16161A
--ink-700: #2A2A30   /* 보조 텍스트 */
--ink-500: #6B6B73   /* 흐린 텍스트, 캡션 */
--ink-300: #B5B3AC   /* 힌트, divider */
--ink-200: #D7D4CB   /* 헤어라인 보더 */
--ink-100: #E8E5DC

--paper-0:   #FFFFFF
--paper-50:  #FAF8F2   /* 슬라이드 기본 배경 — 따뜻한 크림 */
--paper-100: #F4F2EC   /* hero 영역 */
--paper-200: #EDEAE1
```

### Semantic — 판정 4색 (이 4색 외에 새 컬러 추가 금지)

```
AI 생성 확정 (빨강)     : #E0392B / ink #7A1F17 / bg #FBE5E2
실제 이미지 확인 (초록) : #1F8A5B / ink #0E4A30 / bg #E1F1E8
불확실 (앰버)           : #D9A21B / ink #6E4E07 / bg #FBF1D8
정보·지표 (블루)        : #2F6FE5 / ink #16367A / bg #E2EBFB
```

**규칙**: 한 화면에 시맨틱 색은 1개를 메인 액센트로만 사용. 그라데이션·블러 절대 금지.

