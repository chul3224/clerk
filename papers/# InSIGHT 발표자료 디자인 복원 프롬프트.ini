## 📐 간격 (4px base grid)

```
sp-1: 4px   (아이콘 패딩)
sp-2: 8px   (칩 내부)
sp-3: 12px  (리스트 행)
sp-4: 16px  (카드 본문 기본 gap)
sp-5: 24px  (카드 패딩)
sp-6: 32px  (섹션 gap)
sp-7: 48px
sp-8: 64px  (hero 패딩)
sp-9: 96px  (슬라이드 외곽 마진)
```

**슬라이드 외곽 여백**: 1920×1080 기준 좌우 80px, 상단 chrome 48px / 하단 chrome 48px (모노 16px UPPERCASE 텍스트만 들어감).

---

## 🟦 모서리 & 보더 (그림자 거의 안 씀)

```
radius:
  카드 / 입력 / 버튼 : 10–14px
  칩·pill            : 999px (fully rounded)
  분석 판정 박스     : 0px (직각 — "시스템 readout" 느낌)

borders:
  헤어라인 : 1px solid #D7D4CB (ink-200)
  강조     : 1px solid #0B0B0E (ink-900)
  두꺼움   : 2px solid #0B0B0E
  알림     : 1px solid #E0392B + 같은 hue 5% 배경
```

**그림자 사용 금지**. 계층 구분은 라인으로만. (예외: 떠있는 판정 pill 1개, 분석 모달 1개)

---

## 🎬 모션 (한정적 사용)

```
duration : 120ms (tap) / 200ms (hover, fade) / 320ms (panel reveal)
easing   : cubic-bezier(0.2, 0, 0, 1) — bounce/spring 금지
```

**시그니처 모션**: "스캔 라인". 분석 중 이미지 위로 빨간 가로선이 위→아래 1회 sweep (1600ms loop).
```css
@keyframes scan {
  0%   { transform: translateY(0) }
  50%  { transform: translateY(100%) }
  100% { transform: translateY(0) }
}
```

