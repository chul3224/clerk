## 🚫 절대 하지 말 것 (디자인 무너지는 원인)

1. **보라/핑크 그라데이션 배경** — InSIGHT 톤과 정반대.
2. **둥근 일러스트·캐릭터 아이콘** — 라인아트(Lucide)만.
3. **그림자로 카드 띄우기** — 1px 보더만 사용.
4. **이모지 인라인 (`이 기능은 🔥 강력`)** — 카드 prefix 5종만 허용.
5. **`AI 아님`, `진짜!` 같은 단정 표현** — 항상 3분류로.
6. **여러 시맨틱 색 동시 사용** — 한 화면 1색 원칙.
7. **본문에 mono 폰트** — mono는 라벨·메트릭·코드 한정.
8. **Pretendard를 대문자로 강제** — UPPERCASE는 JetBrains Mono로만.
9. **slide padding 80px 미만** — 1920px 슬라이드는 좌우 80px 외곽 절대 사수.
10. **컬러 그림자/glow** — 그림자는 부드러운 검정만.

