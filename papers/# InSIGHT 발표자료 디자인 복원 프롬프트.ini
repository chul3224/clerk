## 🛠 복원 요청 예시 프롬프트

위 시스템을 그대로 보내고 마지막에 이렇게 덧붙이세요:

> 이 디자인 시스템대로 InSIGHT 프로젝트의 [슬라이드 N / 카드 / 컴포넌트]을 다시 만들어줘. HTML + 인라인 CSS로 1920×1080 슬라이드 한 장. 폰트는 Pretendard + JetBrains Mono(CDN), 아이콘은 Lucide(CDN) 사용. 컬러는 정의된 토큰만 쓰고, 새 컬러나 그라데이션 추가 금지. 카피는 한국어 격식체.
